services:
  postgres-test:
    image: postgres:17-alpine
    container_name: aevum-test-postgres
    environment:
      POSTGRES_USER: aevum
      POSTGRES_PASSWORD: aevum_test_password
      POSTGRES_DB: aevum_identity_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevum -d aevum_identity_test"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: aevum-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-test:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: aevum-test-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: aevum
      MINIO_ROOT_PASSWORD: aevum_test_only
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-test-init:
    image: minio/mc:latest
    container_name: aevum-test-minio-init
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-test:9000 aevum aevum_test_only;
      mc mb --ignore-existing --with-lock myminio/aevum-audit;
      mc retention set --default governance 2555d myminio/aevum-audit;
      mc mb --ignore-existing myminio/aevum-media;
      exit 0;
      "

