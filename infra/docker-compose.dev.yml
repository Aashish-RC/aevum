services:
  postgres:
    image: postgres:17-alpine
    container_name: aevum-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aevum
      POSTGRES_PASSWORD: aevum_dev_password
      POSTGRES_DB: aevum_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevum -d aevum_identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aevum-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: aevum-dev-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: aevum
      MINIO_ROOT_PASSWORD: aevum_dev_only
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: aevum-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 aevum aevum_dev_only;
      mc mb --ignore-existing --with-lock myminio/aevum-audit;
      mc retention set --default governance 2555d myminio/aevum-audit;
      mc mb --ignore-existing myminio/aevum-media;
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:

